/* ============================================================= ROSTER == */
function viewRoster() {
  const wrap = h("div", { class: "stack" });

  /* paste box */
  const paste = h("textarea", { class: "inp", placeholder: "7 Riley\n12 Sam\n…" });
  wrap.appendChild(h("div", { class: "panel" },
    h("h2", { class: "sec" }, "Paste names"),
    h("p", { class: "note" }, "One per line, or comma separated. Put the jersey number first if you want it: “7 Riley”."),
    paste,
    h("button", { class: "btn wide", style: { marginTop: "10px" }, onclick: () => {
      const lines = paste.value.split(/[\n,]/).map((x) => x.trim()).filter(Boolean);
      if (!lines.length) return;
      S.roster = lines.map((l, i) => {
        const m = l.match(/^(\d{1,2})[\s.\-)]+(.+)$/);
        const old = S.roster[i];
        return {
          id: (old && old.id) || uid(),
          num: undefined,
          number: m ? m[1] : (old && old.number) || String(i + 1),
          name: m ? m[2] : l,
          positions: (old && old.positions) || []
        };
      });
      commit(); render();
    } }, "Fill roster")));

  /* team name */
  wrap.appendChild(h("div", { class: "panel" },
    h("h2", { class: "sec" }, "Team name"),
    h("input", {
      class: "inp", placeholder: "Your team name", value: S.team,
      onchange: (e) => { S.team = e.target.value.trim(); commit(); render(); }
    })));

  /* roster list */
  const unassigned = S.roster.filter((p) => !(p.positions && p.positions.length)).length;
  wrap.appendChild(h("h2", { class: "sec" }, "Roster · " + S.roster.length));
  if (unassigned) {
    wrap.appendChild(h("div", { class: "banner warn" },
      unassigned + " player" + (unassigned === 1 ? "" : "s") +
      " still need a position — tap all that apply. The court diagram rings whoever is set to S."));
  }

  const list = h("div", { class: "stack", style: { gap: "8px" } });
  for (const p of S.roster) {
    const card = h("div", { class: "panel", style: { padding: "12px" } });
    card.appendChild(h("div", { class: "row" },
      h("input", {
        class: "inp mono mid", style: { flex: "0 0 58px" }, inputmode: "numeric",
        value: p.number || "",
        oninput: (e) => { p.number = e.target.value.replace(/\D/g, "").slice(0, 2); commit({ quiet: true }); }
      }),
      h("input", {
        class: "inp", value: p.name || "",
        oninput: (e) => { p.name = e.target.value; commit({ quiet: true }); }
      }),
      h("button", {
        class: "iconbtn",
        onclick: () => {
          S.roster = S.roster.filter((x) => x.id !== p.id);
          S.lineup.order = S.lineup.order.map((o) => (o === p.id ? null : o));
          if (V.selected === p.id) V.selected = null;
          commit(); render();
        }
      }, "×")));
    const pr = h("div", { class: "posrow" });
    for (const pp of POSITIONS) {
      const on = (p.positions || []).indexOf(pp.code) >= 0;
      pr.appendChild(h("button", {
        class: "posbtn" + (on ? " on" : ""),
        onclick: () => {
          const cur = p.positions || [];
          p.positions = on ? cur.filter((c) => c !== pp.code) : cur.concat([pp.code]);
          commit(); render();
        }
      }, pp.code));
    }
    card.appendChild(pr);
    list.appendChild(card);
  }
  wrap.appendChild(list);

  wrap.appendChild(h("button", {
    class: "btn wide", onclick: () => {
      S.roster.push({ id: uid(), name: "", number: "", positions: [] });
      commit(); render();
    }
  }, "+ Add a player"));

  /* backup */
  /* ---- ask for a change ------------------------------------------- */
  wrap.appendChild(h("h2", { class: "sec" }, "Ask for a change"));
  const rq = S.requests;
  const rbox = h("div", { class: "panel" });

  if (!rq.token) {
    rbox.appendChild(h("p", { class: "note", style: { marginTop: "0" } },
      "Paste the access code you were given. It is stored only on this phone, " +
      "and you only ever do this once."));
    const tk = h("input", { class: "inp mono", type: "password", placeholder: "Access code" });
    const nm = h("input", { class: "inp", placeholder: "Your name (optional)", value: rq.who || "" });
    rbox.appendChild(tk);
    rbox.appendChild(h("div", { style: { height: "10px" } }));
    rbox.appendChild(nm);
    rbox.appendChild(h("button", {
      class: "btn solid wide", style: { marginTop: "12px" },
      onclick: () => {
        rq.token = tk.value.trim();
        rq.who = nm.value.trim();
        commit(); render();
      }
    }, "Save"));
  } else {
    rbox.appendChild(h("p", { class: "note", style: { marginTop: "0" } },
      "Say what you want changed or added, in your own words. It gets built and " +
      "the app updates itself \u2014 you do not need to message anyone."));
    /* its own class: the roster screen already has a textarea (Paste names),
       and "the first textarea" is not a stable way to mean this one */
    const ta = h("textarea", { class: "inp reqbox",
      placeholder: "e.g. I want to see each player's serving stats broken out by set" });
    rbox.appendChild(ta);
    const status = h("p", { class: "note tiny", style: { minHeight: "18px" } });
    const send = h("button", { class: "btn solid wide", style: { marginTop: "10px" } }, "Send request");
    send.onclick = async () => {
      const text = ta.value.trim();
      if (!text) return;
      send.disabled = true;
      status.textContent = "Sending\u2026";
      status.style.color = "var(--dim)";
      try {
        if (!navigator.onLine) throw new Error("offline");
        const n = await sendRequest(text);
        ta.value = "";
        status.textContent = "Sent. It is being worked on now \u2014 the reply appears below.";
        status.style.color = "var(--ok)";
        setTimeout(render, 1200);
      } catch (e) {
        if (!navigator.onLine || /offline|failed to fetch|network/i.test(e.message)) {
          /* no signal in the gym - keep it and send it later, same as photos */
          await Store.queuePut({ id: uid(), kind: "request", text: text, at: Date.now() });
          ta.value = "";
          status.textContent = "No signal, so it is saved on your phone and sends itself later.";
          status.style.color = "var(--g2)";
        } else {
          status.textContent = e.message;
          status.style.color = "var(--bad)";
        }
      }
      send.disabled = false;
    };
    rbox.appendChild(send);
    rbox.appendChild(status);
    rbox.appendChild(h("button", {
      class: "btn quiet wide", style: { marginTop: "2px" },
      onclick: () => { rq.token = ""; commit(); render(); }
    }, "Forget the access code"));
  }
  wrap.appendChild(rbox);

  /* ---- what came back --------------------------------------------- */
  if (rq.sent.length) {
    wrap.appendChild(h("div", { class: "row" },
      h("h2", { class: "sec grow", style: { margin: "0" } }, "Your requests"),
      h("button", { class: "btn quiet sm", onclick: () => refreshRequests() }, "\u21bb Check for replies")));
    const list = h("div", { class: "panel tight" });
    for (const r of rq.sent.slice(0, 8)) {
      list.appendChild(h("div", { class: "lnrow", style: { alignItems: "flex-start" } },
        h("div", { class: "grow", style: { minWidth: "0" } },
          h("div", { class: "lnname" }, r.title),
          h("div", { class: "lnsys" }, r.at + " \u00b7 " +
            (r.state === "closed" ? "done" : "being worked on")),
          r.reply
            ? h("div", { class: "note tiny", style: { marginTop: "6px", color: "var(--text-2)" } }, r.reply)
            : null),
        h("span", { class: "chip", style: r.state === "closed"
          ? { color: "var(--g3)", borderColor: "var(--g3-line)" } : {} },
          r.state === "closed" ? "done" : "in progress")));
    }
    wrap.appendChild(list);
  }

  wrap.appendChild(h("h2", { class: "sec" }, "Backup"));
  const importFile = h("input", { type: "file", accept: "application/json,.json", class: "hide",
    onchange: (e) => {
      const f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(String(r.result));
          if (!d || !Array.isArray(d.roster)) throw new Error("That file is not a Courtside backup.");
          openModal(confirmImport(d));
        } catch (err) { openModal(msgModal("Could not read that backup", err.message)); }
      };
      r.readAsText(f);
    } });
  wrap.appendChild(h("div", { class: "panel" },
    h("p", { class: "note", style: { marginTop: "0" } },
      "A phone can lose browser storage — a reinstall, a wipe, iOS reclaiming space. " +
      "Save a backup after a match and this can never bite you."),
    h("div", { class: "row" },
      h("button", { class: "btn solid grow", onclick: () =>
        download("courtside-backup-" + todayISO() + ".json", JSON.stringify(S, null, 2), "application/json")
      }, "Save backup"),
      h("button", { class: "btn grow", onclick: () => importFile.click() }, "Restore")),
    importFile,
    /* No "undo new match" any more - starting a match never destroys one. */
    null));

  /* health + install */
  const hl = Store.health;
  wrap.appendChild(h("div", { class: "panel" },
    h("h2", { class: "sec" }, "Where your data lives"),
    h("p", { class: "note" },
      "Everything is stored on this device. Nothing is uploaded, and saving never touches " +
      "the network — so a gym with no signal changes nothing."),
    h("div", { class: "wrapper", style: { gap: "6px" } },
      h("span", { class: "pill" + (hl.lsOK ? "" : " err") }, "localStorage " + (hl.lsOK ? "OK" : "BLOCKED")),
      h("span", { class: "pill" + (hl.idbOK ? "" : " err") }, "IndexedDB " + (hl.idbOK ? "OK" : "BLOCKED")),
      h("span", { class: "pill" }, S.matches.length + " matches"),
      h("span", { class: "pill" }, "rev " + S.rev),
      h("span", { class: "pill" + (swReady ? "" : " off") }, swReady ? "OFFLINE READY" : "OFFLINE NOT ARMED"))));

  const installBox = h("div", { class: "panel" },
    h("h2", { class: "sec" }, "Put it on your home screen"),
    h("p", { class: "note" },
      h("strong", null, "iPhone: "), "Share → ", h("span", { class: "kbd" }, "Add to Home Screen"), "."),
    h("p", { class: "note" },
      h("strong", null, "Android: "), "menu → ", h("span", { class: "kbd" }, "Install app"), "."));
  if (deferredInstall) {
    installBox.appendChild(h("button", { class: "btn solid wide", onclick: async () => {
      deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; render();
    } }, "Install now"));
  }
  wrap.appendChild(installBox);

  wrap.appendChild(h("button", { class: "btn danger wide", onclick: () => openModal(
    h("div", { class: "panel modal" },
      h("h2", { class: "sec" }, "Erase everything?"),
      h("p", { class: "note" }, "Roster, match, lineups, subs and scouting on this device. Save a backup first if you are not sure."),
      h("div", { class: "row" },
        h("button", { class: "btn danger grow", onclick: () => {
          Object.assign(S, {
            rev: 0, team: "", roster: freshRoster(), sets: [emptySet()], curSet: 0, log: [],
            lineup: { system: "5-1", order: [null, null, null, null, null, null] },
            subLimit: 15, subLog: [], opponents: [], matchPos: {},
            savedLineups: [], activeLineupId: null,
            matches: [emptyMatch()], curMatch: 0
          });
          commit(); closeModal(); V.tab = "track"; render();
        } }, "Erase"),
        h("button", { class: "btn grow", onclick: closeModal }, "Cancel"))))
  }, "Erase all data"));
  wrap.appendChild(h("p", { class: "note tiny center" },
    "Courtside · offline build" + (appVersion ? " · " + appVersion : "")));
  return wrap;
}

function confirmImport(d) {
  /* Run the file through the same migration the app uses on boot, so a backup
     taken from the old single-match build restores as a season rather than
     being half-read. */
  let mig = null;
  try { mig = migrate(d); } catch (e) { mig = null; }
  const nMatch = mig ? mig.matches.length : 0;
  const nSets = mig ? mig.matches.reduce((a, m) => a + m.sets.length, 0) : 0;
  return h("div", { class: "panel modal" },
    h("h2", { class: "sec" }, "Restore this backup?"),
    !mig
      ? h("p", { class: "note" }, "That file could not be read as a Courtside backup.")
      : h("p", { class: "note" },
          "It holds " + (mig.roster || []).length + " players, " + nMatch +
          " match" + (nMatch === 1 ? "" : "es") + " and " + nSets +
          " set" + (nSets === 1 ? "" : "s") +
          ". This replaces everything on this device right now."),
    h("div", { class: "row" },
      mig ? h("button", { class: "btn solid grow", onclick: () => {
        for (const k in mig) S[k] = mig[k];
        if (!S.roster.length) S.roster = freshRoster();
        V.selected = null;
        commit(); closeModal(); V.tab = "track"; render();
      } }, "Restore") : null,
      h("button", { class: "btn grow", onclick: closeModal }, mig ? "Cancel" : "Close")));
}

function msgModal(title, text) {
  return h("div", { class: "panel modal" },
    h("h2", { class: "sec" }, title),
    h("p", { class: "note" }, text),
    h("button", { class: "btn wide", onclick: closeModal }, "OK"));
}

/* =========================================================== REQUESTS ==
   The coach asks for a change from inside the app. It becomes an issue on the
   repository, which starts a build; the reply comes back to this same screen.
   Nobody has to relay anything. The token lives only in this browser. */
const REPO = "joshuamatalon/courtside";
const GH = "https://api.github.com/repos/" + REPO;

function ghHeaders() {
  return {
    "Authorization": "Bearer " + (S.requests.token || ""),
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28",
    "Content-Type": "application/json"
  };
}

async function sendRequest(text) {
  const who = (S.requests.who || "").trim();
  const first = text.trim().split("\n")[0].slice(0, 70);
  const res = await fetch(GH + "/issues", {
    method: "POST",
    headers: ghHeaders(),
    body: JSON.stringify({
      title: first || "Request from the app",
      body: text.trim() + "\n\n---\nSent from Courtside" + (who ? " by " + who : "") + ".",
      labels: ["coach-request"]
    })
  });
  if (!res.ok) {
    let why = "";
    try { const j = await res.json(); why = j.message || ""; } catch (e) {}
    if (res.status === 401 || res.status === 403) {
      throw new Error("That access code was not accepted. Check it in Setup, or ask for a new one.");
    }
    throw new Error("Could not send (" + res.status + (why ? ": " + why : "") + ").");
  }
  const issue = await res.json();
  S.requests.sent.unshift({
    id: uid(), number: issue.number, title: issue.title,
    at: new Date().toISOString().slice(0, 10),
    state: "open", reply: ""
  });
  if (S.requests.sent.length > 30) S.requests.sent.length = 30;
  commit();
  return issue.number;
}

/* Queued when there is no signal, sent when there is. */
async function flushRequestQueue() {
  if (!navigator.onLine || !S.requests.token) return 0;
  const q = await Store.queueAll();
  let sent = 0;
  for (const item of q) {
    if (!item || item.kind !== "request") continue;
    try { await sendRequest(item.text); await Store.queueDel(item.id); sent++; }
    catch (e) { break; }
  }
  if (sent) render();
  return sent;
}

/* Pull the latest reply for each request so the answer shows up in the app. */
async function refreshRequests() {
  if (!navigator.onLine || !S.requests.token || !S.requests.sent.length) return;
  let changed = false;
  for (const r of S.requests.sent.slice(0, 8)) {
    try {
      const iss = await fetch(GH + "/issues/" + r.number, { headers: ghHeaders() });
      if (!iss.ok) continue;
      const j = await iss.json();
      if (j.state && j.state !== r.state) { r.state = j.state; changed = true; }
      const cs = await fetch(GH + "/issues/" + r.number + "/comments?per_page=100",
        { headers: ghHeaders() });
      if (!cs.ok) continue;
      const list = await cs.json();
      if (Array.isArray(list) && list.length) {
        const reply = String(list[list.length - 1].body || "").split(String.fromCharCode(10) + "---")[0].trim().slice(0, 700);
        if (reply !== r.reply) { r.reply = reply; changed = true; }
      }
    } catch (e) { /* offline or rate limited - leave what we have */ }
  }
  /* Only write when something actually came back. Every commit bumps the
     revision, and a revision that moves on its own makes "did my data
     survive?" impossible to answer. */
  if (changed) { commit(); render(); }
}

/* ============================================================== MISC == */
const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
function download(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function openModal(node) {
  closeModal();
  document.body.appendChild(
    h("div", { class: "scrim", id: "scrim", onclick: (e) => { if (e.target.id === "scrim") closeModal(); } }, node));
}
function closeModal() { const s = $("#scrim"); if (s) s.remove(); }

/* =============================================================== BOOT == */
let deferredInstall = null;
let swReady = false;
let appVersion = "";

window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstall = e; });
window.addEventListener("online", () => { paintBadge(); flushRequestQueue().catch(() => {}); });
window.addEventListener("offline", paintBadge);
for (const ev of ["pagehide", "blur", "visibilitychange"]) {
  window.addEventListener(ev, () => {
    Store.saveSync(S);
    Store.saveMirror(JSON.parse(JSON.stringify(S)));
  });
}

let wakeLock = null;
async function keepAwake() {
  try {
    if ("wakeLock" in navigator && !wakeLock && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});

/* Turn any saved shape into the current one. The very first build stored a
   single match at the top level (sets/curSet/log/subLog); a phone that has
   been in use since then is carrying a real season in that shape, so this has
   to lift it into matches[0] rather than start it over. Anything unreadable
   yields an empty season instead of a crash. */
function migrate(saved) {
  const out = {
    rev: saved.rev || 0,
    team: typeof saved.team === "string" ? saved.team : "",
    roster: [],
    lineup: saved.lineup && Array.isArray(saved.lineup.order)
      ? saved.lineup : { system: "5-1", order: [null, null, null, null, null, null] },
    subLimit: saved.subLimit == null ? 15 : saved.subLimit,
    opponents: Array.isArray(saved.opponents) ? saved.opponents : [],
    matchPos: saved.matchPos || {},
    savedLineups: Array.isArray(saved.savedLineups) ? saved.savedLineups : [],
    activeLineupId: saved.activeLineupId == null ? null : saved.activeLineupId,
    requests: (saved.requests && typeof saved.requests === "object")
      ? { token: saved.requests.token || "", who: saved.requests.who || "",
          sent: Array.isArray(saved.requests.sent) ? saved.requests.sent : [] }
      : { token: "", who: "", sent: [] },
    matches: [],
    curMatch: 0
  };

  if (Array.isArray(saved.roster)) {
    out.roster = saved.roster.map((p) => Object.assign({}, p, {
      positions: Array.isArray(p.positions) ? p.positions : (p.pos ? [p.pos] : [])
    }));
  }

  const fixSets = (sets) => (Array.isArray(sets) && sets.length ? sets : [emptySet()])
    .map((st) => Object.assign({ us: 0, them: 0, serving: null }, st, {
      stats: st && st.stats ? st.stats : {},
      points: st && Array.isArray(st.points) ? st.points : [],
      rotation: st && st.rotation != null ? st.rotation : 0
    }));

  if (Array.isArray(saved.matches) && saved.matches.length) {
    /* already a season */
    out.matches = saved.matches.map((m) => ({
      id: m.id || uid(),
      date: m.date || todayISO(),
      opponent: typeof m.opponent === "string" ? m.opponent : "",
      sets: fixSets(m.sets),
      curSet: Math.min(m.curSet || 0, Math.max(0, fixSets(m.sets).length - 1)),
      log: Array.isArray(m.log) ? m.log : [],
      subLog: Array.isArray(m.subLog) ? m.subLog : []
    }));
    out.curMatch = Math.min(saved.curMatch || 0, out.matches.length - 1);
  } else {
    /* the old single-match shape - lift it in, do not discard it */
    const sets = fixSets(saved.sets);
    const played = sets.some((st) => st.us > 0 || st.them > 0) ||
                   (Array.isArray(saved.log) && saved.log.length > 0);
    const first = {
      id: uid(),
      date: todayISO(),
      opponent: "",
      sets: sets,
      curSet: Math.min(saved.curSet || 0, sets.length - 1),
      log: Array.isArray(saved.log) ? saved.log : [],
      subLog: Array.isArray(saved.subLog) ? saved.subLog : []
    };
    out.matches = [first];
    /* the old "New match" kept one previous match for undo - it is a real
       game and belongs in the season now, oldest first */
    const lm = saved.lastMatch;
    if (lm && Array.isArray(lm.sets) && lm.sets.length) {
      const prevSets = fixSets(lm.sets);
      const prevPlayed = prevSets.some((st) => st.us > 0 || st.them > 0);
      if (prevPlayed) {
        out.matches.unshift({
          id: uid(),
          date: todayISO(),
          opponent: "",
          sets: prevSets,
          curSet: Math.min(lm.curSet || 0, prevSets.length - 1),
          log: Array.isArray(lm.log) ? lm.log : [],
          subLog: Array.isArray(lm.subLog) ? lm.subLog : []
        });
        out.curMatch = 1;
      }
    }
    if (!played && out.matches.length === 1) out.curMatch = 0;
  }

  if (!out.matches.length) out.matches = [emptyMatch()];
  return out;
}

function hydrate(saved) {
  if (!saved || typeof saved !== "object") return false;
  let next;
  try { next = migrate(saved); }
  catch (e) { return false; }   /* keep the running defaults rather than crash */
  for (const k in next) S[k] = next[k];
  if (!S.roster.length) S.roster = freshRoster();
  saveState = "saved";
  savedAt = null;
  return true;
}

async function boot() {
  /* instant path - localStorage is synchronous, so paint on frame one */
  hydrate(Store.loadSync());
  render();
  keepAwake();

  /* durable path - IndexedDB may hold a newer copy than localStorage */
  await Store.init();
  const deep = await Store.load();
  if (deep && (deep.rev || 0) > (S.rev || 0)) { hydrate(deep); render(); }
  else { paintBadge(); storageWarning(); }

  /* opening the app with signal is the natural moment to send anything that
     was written in the gym and to pick up any reply */
  if (navigator.onLine && S.requests && S.requests.token) {
    flushRequestQueue().then(() => refreshRequests()).catch(() => {});
  }

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    try { await navigator.serviceWorker.register("sw.js"); swReady = true; }
    catch (e) { swReady = false; }
  }

  /* read the cache name the service worker is actually running, so this
     phone can be compared against another rather than trusting that a
     reload picked up the newest build */
  if ("caches" in window) {
    try {
      const keys = await caches.keys();
      const hit = keys.find((k) => k.indexOf("courtside-") === 0);
      if (hit) { appVersion = hit.slice("courtside-".length); render(); }
    } catch (e) {}
  }
}

/* test surface - lets a harness assert on real state instead of pixels */
window.CS = {
  S, V, Store, commit, render,
  M, emptyMatch, matchScore, migrate, matchLabel,
  sendRequest, refreshRequests, flushRequestQueue, REPO,
  zoneForServeOrder, applyPoint, emptyStat, emptySet, sumStats,
  hitPct, passAvg, srvPct, fmt2, fmt3, pct,
  scorePoint, undoPoint, logStat, undoStat, applyLineup, playerById, curSet,
  isPlaceholderRoster, freshRoster,
  get appVersion() { return appVersion; },
  set appVersion(v) { appVersion = v; },
  go(tab) { V.tab = tab; render(); }
};

boot();
</script>
</body>
