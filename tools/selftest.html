<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Courtside — self test</title>
<style>
  body{background:#0C0F1C;color:#E9EEFB;font:13px ui-monospace,Menlo,Consolas,monospace;margin:0;padding:16px}
  h1{font-size:15px;margin:0 0 4px}
  .sub{color:#8B96B8;font-size:12px;margin-bottom:12px}
  #wrap{display:flex;gap:16px;align-items:flex-start}
  #out{flex:1;min-width:0}
  .grp{margin:12px 0 4px;color:#6E7BFF;font-weight:700;border-bottom:1px solid #2C3659;padding-bottom:3px}
  .p{color:#3DDC97}
  .f{color:#EA4C60;font-weight:700}
  .d{color:#8B96B8}
  #sum{position:sticky;top:0;background:#0C0F1C;padding:8px 0;font-size:15px;font-weight:700;z-index:2}
  iframe{width:390px;height:660px;border:2px solid #333;border-radius:16px;background:#0A0C11;flex:none}
</style>
</head>
<body>
<h1>Courtside — self test</h1>
<div class="sub">Drives the real app in the frame beside these results. Whatever is saved on this
device is backed up before the run and restored at the end.</div>
<div id="sum">running…</div>
<div id="wrap">
  <div id="out"></div>
  <iframe id="app" src="../index.html"></iframe>
</div>

<script>
const out = document.getElementById('out');
const sum = document.getElementById('sum');
let pass = 0, fail = 0;

const LS_KEY = 'courtside:v1';
const BACKUP = localStorage.getItem(LS_KEY);

function grp(name){ const d=document.createElement('div'); d.className='grp'; d.textContent=name; out.appendChild(d); }
function ok(name, cond, detail){
  const d=document.createElement('div');
  d.className = cond ? 'p' : 'f';
  d.textContent = (cond?'  PASS  ':'  FAIL  ') + name;
  if(detail){ const s=document.createElement('span'); s.className='d'; s.textContent='   ['+detail+']'; d.appendChild(s); }
  out.appendChild(d);
  cond ? pass++ : fail++;
  return cond;
}
const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
const F = ()=>document.getElementById('app');
async function reloadApp(){
  const f = F();
  await new Promise(res=>{ f.onload = res; f.contentWindow.location.reload(); });
  for(let i=0;i<80 && !f.contentWindow.CS;i++) await sleep(50);
  await sleep(200);
  return f.contentWindow.CS;
}
async function waitApp(){
  const f = F();
  for(let i=0;i<80 && !(f.contentWindow && f.contentWindow.CS);i++) await sleep(50);
  await sleep(200);
  return f.contentWindow.CS;
}
/* a roster we control, so assertions do not depend on whatever is saved */
function seedRoster(CS){
  CS.S.roster = Array.from({length:12},(_,i)=>({id:'p'+i,name:'P'+i,number:String(i+1),positions:[i===0?'S':'OH']}));
  CS.S.lineup = { system:'5-1', order:['p0','p1','p2','p3','p4','p5'] };
  CS.S.matches = [CS.emptyMatch()];
  CS.S.curMatch = 0;
  CS.commit();
}

(async function run(){
  let CS = await waitApp();

  /* ---------------------------------------------------------------- */
  grp('1. boot & storage');
  ok('app booted', !!CS);
  ok('localStorage available', CS.Store.health.lsOK);
  ok('IndexedDB available', CS.Store.health.idbOK);
  ok('service worker controlling (offline armed)',
     !!F().contentWindow.navigator.serviceWorker.controller,
     'false is expected on file:// only');

  /* ---------------------------------------------------------------- */
  grp('2. rotation geometry — the flagged top risk');
  const Z = CS.zoneForServeOrder;
  for(let rot=0; rot<6; rot++){
    const zones = [1,2,3,4,5,6].map(o=>Z(o,rot));
    ok('rotation '+(rot+1)+' puts six players in six distinct zones',
       new Set(zones).size===6 && zones.every(z=>z>=1&&z<=6), zones.join(','));
  }
  ok('rotation 1 is the identity (serve order N stands in zone N)',
     [1,2,3,4,5,6].every(o=>Z(o,0)===o));
  const CW = {2:1,1:6,6:5,5:4,4:3,3:2};
  let cwOK = true, cwWhy = '';
  for(let rot=0; rot<6; rot++) for(let o=1;o<=6;o++){
    const a=Z(o,rot), b=Z(o,(rot+1)%6);
    if(CW[a]!==b){ cwOK=false; cwWhy='order '+o+' rot '+rot+': '+a+'→'+b+', expected '+CW[a]; }
  }
  ok('every rotation moves each player exactly one zone clockwise', cwOK, cwWhy||'2→1→6→5→4→3→2');
  const servers = [];
  for(let rot=0;rot<6;rot++) servers.push([1,2,3,4,5,6].find(o=>Z(o,rot)===1));
  ok('the server walks through all six in serving order',
     servers.join(',')==='1,2,3,4,5,6', servers.join(','));

  /* ---------------------------------------------------------------- */
  grp('3. sideout scoring — you only rotate when you win a rally you were not serving');
  const AP = CS.applyPoint;
  const mk = (serving,rotation)=>({us:0,them:0,serving,rotation,points:[],stats:{}});
  let st = mk('us',0);
  for(let i=0;i<5;i++) st = Object.assign(st, AP(st,'us'));
  ok('five straight points while serving does not rotate', st.rotation===0 && st.us===5, 'rot='+st.rotation);
  st = mk('them',0); st = Object.assign(st, AP(st,'us'));
  ok('winning a rally on their serve rotates us once and wins serve',
     st.rotation===1 && st.serving==='us', 'rot='+st.rotation+' serving='+st.serving);
  st = mk('us',3); st = Object.assign(st, AP(st,'them'));
  ok('losing our serve does not rotate us', st.rotation===3 && st.serving==='them', 'rot='+st.rotation);
  st = mk('them',2);
  for(let i=0;i<7;i++) st = Object.assign(st, AP(st,'them'));
  ok('an opponent run does not rotate us', st.rotation===2, 'rot='+st.rotation);
  /* This one has to prove rotation MOVED, not just that it ended at zero.
     Written as "ends at 0" it passed even with rotation completely disabled,
     because 0 === 0 - caught by deliberately sabotaging applyPoint. */
  st = mk('them',0);
  const seen = [st.rotation];
  for(let i=0;i<6;i++){
    st = Object.assign(st, AP(st,'us'));
    seen.push(st.rotation);
    st = Object.assign(st, AP(st,'them'));
  }
  ok('each sideout advances the rotation by exactly one',
     seen.join(',')==='0,1,2,3,4,5,0', seen.join(','));
  ok('six sideouts return to rotation 1', st.rotation===0, 'rot='+st.rotation);
  ok('the rotation actually moved (not stuck on one value)',
     new Set(seen).size===6, new Set(seen).size+' distinct rotations seen');

  /* ---------------------------------------------------------------- */
  grp('4. undo last point — the other flagged risk');
  seedRoster(CS);
  CS.go('track'); await sleep(200);
  const set0 = CS.curSet();
  set0.serving = 'them'; CS.commit();
  const before = { us:set0.us, them:set0.them, serving:set0.serving, rotation:set0.rotation };
  CS.scorePoint('us');                       /* sideout: score, serve AND rotation all move */
  const mid = CS.curSet();
  ok('the sideout changed score, serve and rotation together',
     mid.us===before.us+1 && mid.serving==='us' && mid.rotation===(before.rotation+1)%6,
     'us='+mid.us+' serving='+mid.serving+' rot='+mid.rotation);
  CS.undoPoint();
  const after = CS.curSet();
  ok('undo restores the score', after.us===before.us && after.them===before.them);
  ok('undo restores who was serving', after.serving===before.serving, after.serving);
  ok('undo restores the rotation', after.rotation===before.rotation, 'rot='+after.rotation);
  ok('undo removes the point from history', (after.points||[]).length===0);

  /* a longer random sequence must unwind perfectly, one point at a time */
  let seed=5; const rnd=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648;
  const s2 = CS.curSet(); s2.serving='us'; CS.commit();
  const snaps = [];
  for(let i=0;i<30;i++){
    snaps.push({us:s2.us,them:s2.them,serving:s2.serving,rotation:s2.rotation});
    CS.scorePoint(rnd()<0.5?'us':'them');
  }
  let unwindOK = true, unwindWhy='';
  for(let i=29;i>=0;i--){
    CS.undoPoint();
    const c = CS.curSet(), e = snaps[i];
    if(c.us!==e.us||c.them!==e.them||c.serving!==e.serving||c.rotation!==e.rotation){
      unwindOK=false; unwindWhy='step '+i+': got '+c.us+'-'+c.them+'/'+c.serving+'/'+c.rotation+
        ' expected '+e.us+'-'+e.them+'/'+e.serving+'/'+e.rotation; break;
    }
  }
  ok('30 random points unwind exactly, one undo at a time', unwindOK, unwindWhy||'every step matched');

  /* ---------------------------------------------------------------- */
  grp('5. stat logging and undo');
  seedRoster(CS); CS.go('track'); await sleep(150);
  CS.logStat('p0','Kill',{kills:1,atkAtt:1},'Attack');
  CS.logStat('p0','Kill',{kills:1,atkAtt:1},'Attack');
  CS.logStat('p0','Error',{atkErr:1,atkAtt:1},'Attack');
  const s5 = CS.curSet().stats['p0'];
  ok('kills and attempts accumulate', s5.kills===2 && s5.atkAtt===3, 'K'+s5.kills+' att'+s5.atkAtt);
  ok('hitting percentage is (kills − errors) ÷ attempts',
     Math.abs(CS.hitPct(s5) - (2-1)/3) < 1e-9, CS.fmt3(CS.hitPct(s5)));
  CS.logStat('p1','3',{passSum:3,passCount:1},'Serve-receive pass');
  CS.logStat('p1','2',{passSum:2,passCount:1},'Serve-receive pass');
  ok('pass average is the mean rating', Math.abs(CS.passAvg(CS.curSet().stats['p1']) - 2.5) < 1e-9,
     CS.fmt2(CS.passAvg(CS.curSet().stats['p1'])));
  CS.undoStat();
  ok('undo removes exactly the last stat',
     CS.curSet().stats['p1'].passCount===1 && CS.curSet().stats['p1'].passSum===3);
  ok('undo never drives a counter negative', (()=>{ for(let i=0;i<20;i++) CS.undoStat();
     const a=CS.curSet().stats['p0']||{}; return (a.kills||0)>=0 && (a.atkAtt||0)>=0; })());

  /* match totals must add the sets, not just show one */
  seedRoster(CS);
  CS.M().sets = [CS.emptySet(), CS.emptySet()];
  CS.M().sets[0].stats['p0'] = Object.assign(CS.emptyStat(), {kills:4, atkAtt:6});
  CS.M().sets[1].stats['p0'] = Object.assign(CS.emptyStat(), {kills:3, atkAtt:5});
  CS.commit();
  const tot = CS.sumStats(CS.M().sets,'p0');
  ok('match total sums every set', tot.kills===7 && tot.atkAtt===11, 'K'+tot.kills+' att'+tot.atkAtt);

  /* ---------------------------------------------------------------- */
  grp('6. saved lineups — apply and save over');
  seedRoster(CS);
  CS.S.matchPos = { p0:'S' };
  CS.S.savedLineups = [{id:'A',name:'A',system:'5-1',order:['p0','p1','p2','p3','p4','p5'],matchPos:{p0:'S'}},
                       {id:'B',name:'B',system:'6-2',order:['p5','p4','p3','p2','p1','p0'],matchPos:{p5:'S'}}];
  CS.commit();
  CS.applyLineup('B');
  ok('applying a lineup swaps the serving order', CS.S.lineup.order[0]==='p5', CS.S.lineup.order.join(','));
  ok('applying a lineup swaps the system', CS.S.lineup.system==='6-2', CS.S.lineup.system);
  ok('applying a lineup swaps positions-this-match', CS.S.matchPos.p5==='S' && !CS.S.matchPos.p0);
  ok('the applied lineup is marked in use', CS.S.activeLineupId==='B');
  CS.applyLineup('A');
  ok('switching back restores the first lineup', CS.S.lineup.order[0]==='p0' && CS.S.lineup.system==='5-1');
  ok('applying an unknown id changes nothing', (()=>{ const b=JSON.stringify(CS.S.lineup);
      CS.applyLineup('nope'); return JSON.stringify(CS.S.lineup)===b; })());
  /* save-over must capture the CURRENT lineup into the named slot */
  CS.S.lineup.order[0]='p7'; CS.commit();
  const slot = CS.S.savedLineups.find(x=>x.id==='A');
  slot.order = CS.S.lineup.order.slice(); slot.system = CS.S.lineup.system;
  slot.matchPos = Object.assign({}, CS.S.matchPos); CS.commit();
  CS.applyLineup('B'); CS.applyLineup('A');
  ok('save over then reload the preset returns the edited six',
     CS.S.lineup.order[0]==='p7', CS.S.lineup.order.join(','));
  ok('a saved preset is an independent copy, not a live reference',
     (()=>{ CS.S.lineup.order[1]='p9';
       return CS.S.savedLineups.find(x=>x.id==='A').order[1]!=='p9'; })());

  /* ---------------------------------------------------------------- */
  grp('7. subs keep the court truthful');
  seedRoster(CS);
  CS.go('subs'); await sleep(200);
  const D0 = F().contentDocument;
  const onCourtBefore = CS.S.lineup.order.slice();
  /* tap who comes out, then who comes in - the real two-step flow */
  const outChip = [...D0.querySelectorAll('.pchip')].find(b=>/P2/.test(b.textContent));
  ok('an on-court player can be tapped to come out', !!outChip);
  outChip.click(); await sleep(200);
  const inChip = [...F().contentDocument.querySelectorAll('.pchip.in')][0];
  ok('the bench becomes tappable once someone is coming out', !!inChip);
  inChip.click(); await sleep(250);
  ok('the substitute replaces the exact player who left',
     CS.S.lineup.order.indexOf('p2')<0 && CS.S.lineup.order.length===6,
     CS.S.lineup.order.join(','));
  ok('the sub is recorded against the current set',
     CS.M().subLog.length===1 && CS.M().subLog[0].outId==='p2' && CS.M().subLog[0].setIdx===CS.M().curSet);
  ok('serving order slots are preserved, not reshuffled',
     CS.S.lineup.order.filter(Boolean).length===6);
  /* the court must now show the substitute standing in the same spot */
  const slotIdx = onCourtBefore.indexOf('p2');
  ok('the substitute inherits the leaver serving slot',
     CS.S.lineup.order[slotIdx] === CS.M().subLog[0].inId, 'slot '+slotIdx);

  /* ---------------------------------------------------------------- */
  grp('8. no sideways scrolling on a phone');
  for(const w of [320,360,390,430]){
    F().style.width = w+'px';
    await sleep(300);
    const doc = F().contentDocument.documentElement;
    const mainEl = F().contentDocument.querySelector('main');
    const vw = F().contentWindow.innerWidth;
    ok('no horizontal scroll at '+w+'px', doc.scrollWidth <= vw+1,
       'scrollW '+doc.scrollWidth+' vs '+vw);
    ok('content fits the scroller at '+w+'px',
       !mainEl || mainEl.scrollWidth <= mainEl.clientWidth+1,
       mainEl ? mainEl.scrollWidth+' vs '+mainEl.clientWidth : 'no main');
  }
  F().style.width='390px'; await sleep(250);

  /* ---------------------------------------------------------------- */
  grp('9. phone ergonomics: locked nav, tap targets, no stray zoom');
  {
    const D=F().contentDocument, W=F().contentWindow;
    CS.go('track'); await sleep(250);
    const nav=D.querySelector('nav.tabs'), mainEl=D.querySelector('main');
    ok('nav is a layout row, not a floating fixed bar',
       W.getComputedStyle(nav).position==='static', W.getComputedStyle(nav).position);
    const nr=nav.getBoundingClientRect();
    ok('whole nav is inside the viewport', nr.bottom<=W.innerHeight+1 && nr.top>=0,
       nr.top.toFixed(0)+'-'+nr.bottom.toFixed(0)+' vs '+W.innerHeight);
    ok('nav sits flush against the bottom edge', Math.abs(nr.bottom-W.innerHeight)<2,
       (W.innerHeight-nr.bottom).toFixed(1)+'px gap');
    mainEl.scrollTop = 500; await sleep(220);
    ok('the list really scrolled (so the next check means something)', mainEl.scrollTop>50,
       'scrollTop='+mainEl.scrollTop);
    ok('nav does not move when the page scrolls',
       Math.abs(nav.getBoundingClientRect().top-nr.top)<0.5);
    mainEl.scrollTop = 0; await sleep(150);

    /* The point buttons live in the pinned rally bar, which deliberately does
       not exist until someone has chosen who serves first - there is nothing
       sensible to score before that. Put the set in a real state first. */
    CS.curSet().serving = 'us'; CS.commit(); CS.render(); await sleep(250);
    const pt = D.querySelector('.rally .ptbtn');
    ok('point buttons exist once a server is chosen', !!pt);
    const r = pt.getBoundingClientRect();
    ok('point button >= 44px tall', r.height>=44, r.height.toFixed(0)+'px');
    ok('point button opts out of double-tap zoom',
       W.getComputedStyle(pt).touchAction==='manipulation', W.getComputedStyle(pt).touchAction);

    let small=[], n=0;
    for(const v of ['track','stats','lineup','subs','scout','roster']){
      CS.go(v); await sleep(220);
      for(const el of D.querySelectorAll('input,textarea,select')){
        if(!el.offsetParent) continue;
        n++;
        const px=parseFloat(W.getComputedStyle(el).fontSize);
        if(px<16) small.push((el.className||el.tagName).trim()+' @'+px);
      }
    }
    ok('no focusable field under 16px (iOS focus-zoom threshold)', small.length===0,
       small.length ? [...new Set(small)].join(', ') : n+' fields swept across 6 views');
    const vp = (D.querySelector('meta[name=viewport]')||{}).content||'';
    ok('viewport still allows pinch-zoom', !/maximum-scale|user-scalable\s*=\s*no/.test(vp), vp);
  }

  /* ---------------------------------------------------------------- */
  grp('10. the stats table always shows WHO the numbers belong to');
  /* This failed for real: seven columns filled the row, the name column
     collapsed to zero width, and the table rendered perfectly correct
     figures next to nobody. Nothing threw and nothing looked broken. */
  {
    const D=F().contentDocument, W=F().contentWindow;
    seedRoster(CS);
    CS.M().sets[0].stats['p0'] = Object.assign(CS.emptyStat(),
      {kills:9, atkErr:3, atkAtt:20, aces:4, srvErr:2, srvAtt:19, passSum:31, passCount:14, digs:7, blocks:2});
    CS.commit();
    for(const w of [320,390]){
      F().style.width = w+'px';
      CS.go('stats'); await sleep(320);
      const names = [...D.querySelectorAll('.trow .tname')];
      ok('player names render at '+w+'px', names.length>0, names.length+' rows');
      const widths = names.map(n=>n.getBoundingClientRect().width);
      ok('no name column collapsed at '+w+'px', widths.every(x=>x>=40),
         'narrowest ' + Math.min.apply(null, widths).toFixed(1) + 'px');
      ok('the first row names a real player at '+w+'px',
         /P0/.test(names[0].textContent), names[0].textContent);
      /* a table cell must not pick up styling from a same-named button class:
         .tcell.key also matched .key (the stat button) and every highlighted
         figure rendered as a bordered 56px-tall button inside the table */
      const rowH = D.querySelector('.trow').getBoundingClientRect().height;
      ok('table rows are table-height, not button-height, at '+w+'px', rowH < 48,
         rowH.toFixed(0)+'px');
      const cellBorder = W.getComputedStyle(D.querySelector('.trow .tcell')).borderTopWidth;
      ok('table cells have no button border at '+w+'px',
         cellBorder === '0px' || cellBorder === '', cellBorder);
      const doc = D.documentElement;
      ok('the page still does not scroll sideways at '+w+'px',
         doc.scrollWidth <= F().contentWindow.innerWidth+1,
         doc.scrollWidth+' vs '+F().contentWindow.innerWidth);
    }
    F().style.width='390px'; await sleep(250);
  }

  grp('11. the live scoring loop — can a coach actually use this mid-rally?');
  /* The app can be entirely correct and still fail the job it exists for.
     render() rebuilds main, which threw the scroll position away: measured
     scrollTop 900 -> 0 on EVERY tap, on a screen 2.77 viewports tall. The
     coach scrolled down, logged one kill, and got fired back to the top. */
  {
    const D=F().contentDocument, W=F().contentWindow;
    seedRoster(CS);
    CS.S.roster = Array.from({length:15},(_,i)=>({id:'q'+i,name:'N'+i,number:String(i+1),positions:['OH']}));
    CS.S.lineup = { system:'5-1', order:['q0','q1','q2','q3','q4','q5'] };
    CS.curSet().serving='us'; CS.V.selected='q0'; CS.commit();
    /* the previous group left the app on Stats - go to Track explicitly,
       otherwise render() rebuilds the wrong screen and none of the live
       controls this group is about even exist */
    CS.go('track');
    await sleep(300);
    const main = () => D.querySelector('main');

    ok('the rally bar is pinned on Track', !!D.querySelector('.rally'));
    const pts = [...D.querySelectorAll('.rally .ptbtn')];
    ok('both point buttons live in it', pts.length===2);
    /* Guard every lookup below. A null here throws and kills every remaining
       group - one structural change already cost six groups that way. */
    const statKey = D.querySelector('.key');
    ok('stat keys are present for the selected player', !!statKey);
    if (!pts.length || !statKey) {
      ok('SKIPPED the rest of the loop checks — structure missing', false,
         'pts=' + pts.length + ' key=' + !!statKey);
    } else {

    const reach = (el)=>{ const r=el.getBoundingClientRect(); return r.top>=0 && r.bottom<=W.innerHeight+1; };
    ok('point buttons need no scrolling', pts.every(reach),
       pts.map(b=>b.getBoundingClientRect().top.toFixed(0)).join(','));

    /* park where the work happens, then tap repeatedly and watch for drift */
    const maxScroll = main().scrollHeight - main().clientHeight;
    const park = Math.min(430, maxScroll);
    main().scrollTop = park; await sleep(200);
    const s0 = main().scrollTop;
    let drift = 0;
    for(let i=0;i<8;i++){
      D.querySelector('.key').click(); await sleep(100);
      drift = Math.max(drift, Math.abs(main().scrollTop - s0));
    }
    ok('scroll holds across 8 stat taps', drift<=2, 'worst drift '+drift+'px from '+s0);
    for(let i=0;i<5;i++){
      D.querySelector('.rally .ptbtn').click(); await sleep(100);
      drift = Math.max(drift, Math.abs(main().scrollTop - s0));
    }
    ok('scroll holds across 5 point taps', drift<=2, 'worst drift '+drift+'px');
    ok('point buttons are still reachable while parked on the stats',
       [...D.querySelectorAll('.rally .ptbtn')].every(reach));

    /* the restore must happen AFTER the pinned bar exists, or the browser
       clamps it to the taller layout's smaller maximum and it still jumps */
    ok('the parked position was not silently clamped', main().scrollTop===s0,
       main().scrollTop+' vs '+s0);

    /* Measured in pixels, not "screens". The ratio depends on the test frame's
       height, so a fixed ratio threshold fails for reasons that have nothing to
       do with the app. Before the pass, Track was 2350px with a 15-player
       roster; the duplicated positions panel and point row accounted for ~700
       of that. */
    const mh = main().scrollHeight, vh = main().clientHeight;
    ok('Track is materially shorter than the 2350px it was', mh < 1900,
       mh+'px (was 2350px) — '+(mh/vh).toFixed(2)+' screens at this frame height');

    /* switching screens should land at the top like any new page */
    main().scrollTop = 300; await sleep(150);
    CS.go('stats'); await sleep(250);
    ok('changing tab lands at the top', main().scrollTop===0, 'scrollTop='+main().scrollTop);
    CS.go('roster'); await sleep(250);
    ok('the rally bar does not follow you off Track',
       !W.document.body.classList.contains('quickon'));
    CS.go('track'); await sleep(250);
    ok('the rally bar comes back on Track', !!D.querySelector('.rally'));

    /* "Positions this match" belongs on Lineup, not duplicated onto the live
       screen where a 15-row panel just pushes the working area further away */
    CS.go('track'); await sleep(220);
    const trackSelects = D.querySelectorAll('.mprow').length;
    CS.go('lineup'); await sleep(220);
    const lineupSelects = D.querySelectorAll('.mprow').length;
    ok('positions panel is on Lineup only, not duplicated onto Track',
       trackSelects===0 && lineupSelects>0, 'track '+trackSelects+' / lineup '+lineupSelects);
    CS.go('track'); await sleep(200);
    }
  }

  grp('12. every screen renders without throwing');
  for(const v of ['track','stats','lineup','subs','scout','roster']){
    let threw = null;
    try { CS.go(v); await sleep(220); } catch(e){ threw = e.message; }
    const kids = F().contentDocument.querySelectorAll('main *').length;
    ok(v+' renders', !threw && kids>5, threw || kids+' nodes');
  }

  /* ---------------------------------------------------------------- */
  grp('13. persistence across a full reload');
  seedRoster(CS);
  CS.S.team = 'TestTeam';
  CS.go('track'); await sleep(150);
  CS.curSet().serving='us'; CS.commit();
  for(let i=0;i<14;i++) CS.scorePoint(i%3===0?'them':'us');
  CS.logStat('p0','Kill',{kills:1,atkAtt:1},'Attack');
  CS.logStat('p1','Ace',{aces:1,srvAtt:1},'Serve');
  CS.commit();
  await sleep(800);
  const exp = {
    us: CS.curSet().us, them: CS.curSet().them,
    serving: CS.curSet().serving, rotation: CS.curSet().rotation,
    logs: CS.M().log.length, roster: CS.S.roster.length, team: CS.S.team, rev: CS.S.rev
  };
  CS = await reloadApp();
  const got = {
    us: CS.curSet().us, them: CS.curSet().them,
    serving: CS.curSet().serving, rotation: CS.curSet().rotation,
    logs: CS.M().log.length, roster: CS.S.roster.length, team: CS.S.team, rev: CS.S.rev
  };
  ok('score survived', got.us===exp.us && got.them===exp.them, got.us+'-'+got.them);
  ok('serve and rotation survived', got.serving===exp.serving && got.rotation===exp.rotation,
     got.serving+' / rot '+got.rotation);
  ok('event log survived', got.logs===exp.logs, got.logs+' vs '+exp.logs);
  ok('roster and team name survived', got.roster===exp.roster && got.team===exp.team);
  ok('revision counter survived', got.rev===exp.rev, got.rev+' vs '+exp.rev);

  /* ---------------------------------------------------------------- */
  grp('14. survives losing localStorage (IndexedDB rescue)');
  F().contentWindow.localStorage.removeItem(LS_KEY);
  ok('localStorage wiped', !F().contentWindow.localStorage.getItem(LS_KEY));
  CS = await reloadApp();
  ok('IndexedDB restored the match', CS.curSet().us===exp.us && CS.curSet().them===exp.them,
     CS.curSet().us+'-'+CS.curSet().them);
  ok('rotation restored too', CS.curSet().rotation===exp.rotation);

  /* ---------------------------------------------------------------- */
  grp('15. backup round trip — the flagged export/import risk');
  const blob = JSON.stringify(CS.S);
  const parsed = JSON.parse(blob);
  ok('backup is valid JSON with a roster', Array.isArray(parsed.roster) && parsed.roster.length>0);
  ok('backup carries the season', Array.isArray(parsed.matches) && parsed.matches.length>0,
     (parsed.matches||[]).length + ' matches');
  ok('backup carries the match score',
     parsed.matches && parsed.matches[parsed.curMatch||0].sets[0].us===exp.us,
     'us=' + (parsed.matches ? parsed.matches[parsed.curMatch||0].sets[0].us : '?'));
  ok('backup carries lineups and scouting keys',
     'savedLineups' in parsed && 'opponents' in parsed && 'matchPos' in parsed);
  /* wipe, then restore from the blob exactly as the Restore button does */
  CS.S.roster = []; CS.S.matches = [CS.emptyMatch()]; CS.S.curMatch = 0; CS.S.team=''; CS.commit();
  ok('state cleared before restore', CS.S.roster.length===0 && CS.curSet().us===0);
  const d = JSON.parse(blob);
  const mig = CS.migrate(d);
  for (const k in mig) CS.S[k] = mig[k];
  CS.commit();
  ok('restore brings the roster back', CS.S.roster.length===exp.roster);
  ok('restore brings the score back', CS.curSet().us===exp.us && CS.curSet().them===exp.them);
  ok('restore brings serve and rotation back',
     CS.curSet().serving===exp.serving && CS.curSet().rotation===exp.rotation);
  ok('restore brings the team name back', CS.S.team===exp.team, CS.S.team);

  /* ---------------------------------------------------------------- */
  grp('16. the season — a match no longer costs you the last one');
  /* The three things the coach asked for after using it:
       "I can't save one match then go to another one"
       "I would like to be able to name the team we are playing against"
       "the stats I would like them all show rather than just percentages" */
  {
    const D = F().contentDocument;

    /* Check the constructor's own shape, not just behaviour. M() repairs a
       malformed match on access, so a broken emptyMatch() produced perfectly
       working matches and hid itself completely - every other assertion in
       this file passed while emptyMatch was returning the wrong fields. */
    const proto = CS.emptyMatch();
    ok('a new match has its own sets', Array.isArray(proto.sets) && proto.sets.length===1,
       Object.keys(proto).join(','));
    ok('a new match has curSet, log and subLog',
       proto.curSet===0 && Array.isArray(proto.log) && Array.isArray(proto.subLog));
    ok('a new match does not carry season fields',
       !('matches' in proto) && !('curMatch' in proto), Object.keys(proto).join(','));
    ok('a new match has an id, a date and an opponent slot',
       !!proto.id && /^\d{4}-\d{2}-\d{2}$/.test(proto.date) && proto.opponent==='',
       proto.date);

    seedRoster(CS);
    CS.S.roster = Array.from({length:6},(_,i)=>({id:'m'+i,name:'M'+i,number:String(i+1),positions:['OH']}));
    CS.S.lineup = { system:'5-1', order:['m0','m1','m2','m3','m4','m5'] };
    CS.S.matches = [CS.emptyMatch()];
    CS.S.curMatch = 0;
    CS.commit();

    /* play match one */
    CS.M().opponent = 'Northern';
    CS.curSet().serving = 'us';
    for (let i=0;i<10;i++) CS.scorePoint('us');
    CS.logStat('m0','Kill',{kills:1,atkAtt:1},'Attack');
    CS.logStat('m0','Kill',{kills:1,atkAtt:1},'Attack');
    CS.commit();
    const firstId = CS.M().id;
    ok('a match can be named', CS.M().opponent==='Northern', CS.M().opponent);
    ok('match one has its score', CS.curSet().us===10, CS.curSet().us);

    /* start match two - the old one must survive */
    const m2 = CS.emptyMatch();
    m2.opponent = 'Southside';
    CS.S.matches.push(m2);
    CS.S.curMatch = 1;
    CS.commit();
    ok('starting a new match keeps the old one', CS.S.matches.length===2, CS.S.matches.length+' matches');
    ok('the new match starts empty', CS.curSet().us===0 && CS.curSet().them===0);
    ok('the new match has its own name', CS.M().opponent==='Southside', CS.M().opponent);

    CS.curSet().serving='them';
    for (let i=0;i<4;i++) CS.scorePoint('them');
    CS.logStat('m0','Kill',{kills:1,atkAtt:1},'Attack');
    CS.commit();

    /* the first match must be untouched by any of that */
    const one = CS.S.matches.find(x=>x.id===firstId);
    ok('match one still exists after playing match two', !!one);
    ok('match one kept its score', one.sets[0].us===10, one.sets[0].us);
    ok('match one kept its stats', CS.sumStats(one.sets,'m0').kills===2,
       'K'+CS.sumStats(one.sets,'m0').kills);
    ok('match one kept its name', one.opponent==='Northern', one.opponent);
    ok('the two matches do not share a log',
       one.log.length===2 && CS.S.matches[1].log.length===1,
       one.log.length+' vs '+CS.S.matches[1].log.length);

    /* switching back and forth must not blur them together */
    CS.S.curMatch = 0; CS.commit();
    ok('switching back lands on match one', CS.curSet().us===10 && CS.M().opponent==='Northern');
    CS.S.curMatch = 1; CS.commit();
    ok('switching forward lands on match two', CS.curSet().them===4 && CS.M().opponent==='Southside');

    /* season totals must span both */
    const seasonSets = CS.S.matches.reduce((a,m)=>a.concat(m.sets),[]);
    const seasonK = CS.sumStats(seasonSets,'m0').kills;
    const matchK = CS.sumStats(CS.M().sets,'m0').kills;
    ok('season totals add every match', seasonK===3, 'season K'+seasonK);
    ok('match totals stay scoped to one match', matchK===1, 'match K'+matchK);

    /* the stat sheet: every tracked number, not just the derived ones */
    CS.M().sets[0].stats['m0'] = Object.assign(CS.emptyStat(),
      {kills:9,atkErr:3,atkAtt:22,aces:4,srvErr:2,srvAtt:20,passSum:33,passCount:15,digs:8,blocks:2});
    CS.commit();
    CS.go('stats'); await sleep(300);
    const heads = [...D.querySelectorAll('.thead .tcell')].map(e=>e.textContent);
    for (const col of ['K','E','TA','PCT','ACE','SE','TS','SRV%','RCV','AVG','D','B']) {
      ok('stat sheet shows ' + col, heads.indexOf(col) >= 0, heads.join(' '));
    }
    ok('attempts are shown, not just percentages',
       heads.indexOf('TA')>=0 && heads.indexOf('TS')>=0 && heads.indexOf('RCV')>=0);
    const row = [...D.querySelectorAll('.trow')].find(r=>/M0/.test(r.textContent));
    const cells = row ? [...row.querySelectorAll('.tcell')].map(e=>e.textContent) : [];
    ok('total attacks shows the real count', cells[2]==='22', cells.join('|'));
    ok('total serves shows the real count', cells[6]==='20', cells[6]);
    ok('receptions show the real count', cells[8]==='15', cells[8]);
    ok('a team row is present', [...D.querySelectorAll('.tname')].some(e=>e.textContent==='TEAM'));

    /* A full box score is wider than a phone. It scrolls in its own box, and
       the player column has to stay put or you lose track of whose row it is.
       Compare against the SCROLLER, not the row - they move together exactly
       when stickiness has failed. */
    {
      const W2 = F().contentWindow;
      const tw = D.querySelector('.tablewrap');
      ok('the stat table scrolls rather than squeezing', tw.scrollWidth > tw.clientWidth,
         tw.scrollWidth + ' vs ' + tw.clientWidth);
      const twL = tw.getBoundingClientRect().left;
      tw.scrollLeft = 9999; await sleep(300);
      const nameL = D.querySelector('.trow .tname').getBoundingClientRect().left - twL;
      const rowL = D.querySelector('.trow').getBoundingClientRect().left - twL;
      ok('the row really scrolled sideways', rowL < -50, 'row at ' + rowL.toFixed(0));
      ok('the player column stays pinned while it does', Math.abs(nameL) < 3,
         'name at ' + nameL.toFixed(0));
      ok('the page itself never scrolls sideways',
         D.documentElement.scrollWidth <= W2.innerWidth + 1);
      tw.scrollLeft = 0; await sleep(200);
    }

    /* the three scopes */
    for (const [k,label] of [['set','set'],['match','match'],['season','season']]) {
      CS.V.statView = k; CS.render(); await sleep(200);
      ok('stat sheet renders in '+label+' scope', D.querySelectorAll('.trow').length>0,
         D.querySelectorAll('.trow').length+' rows');
    }
    CS.V.statView='match'; CS.go('track'); await sleep(200);
    ok('the match bar names the current match', /Southside/.test((D.querySelector('.matchbar')||{}).textContent||''),
       (D.querySelector('.matchbar .mb-t')||{}).textContent);
  }

  grp('17. the cached shell is the app, not some other page');
  /* A looser scope test let any directory navigation overwrite ./index.html
     in the cache with that directory's page - which bricks an installed app
     until site data is cleared. Observed at /tools/. */
  {
    const W = F().contentWindow;
    const names = await W.caches.keys();
    ok('a cache exists', names.length>0, names.join(','));
    if (names.length) {
      const c = await W.caches.open(names[0]);
      const hit = await c.match('./index.html');
      ok('the shell is cached', !!hit);
      if (hit) {
        const txt = await hit.text();
        ok('the cached shell is the Courtside app', txt.indexOf('<title>Courtside</title>') >= 0,
           txt.length + ' bytes cached');
        ok('the cached shell is a real document', txt.trim().indexOf('<!doctype html>') === 0);
        ok('the cached shell is not some other page', txt.indexOf('Directory listing') < 0);
      }
    }
  }

  grp('17b. Roster shows the version so two phones can be compared');
  /* The coach cannot tell from inside the app whether a phone has picked up
     the newest build. The version shown must be the cache this phone is
     actually running, not a hardcoded string that could drift from sw.js. */
  {
    const W = F().contentWindow;
    const names = await W.caches.keys();
    const hit = names.find((n) => n.indexOf('courtside-') === 0);
    ok('a courtside cache exists to read a version from', !!hit, names.join(','));
    if (hit) {
      const expected = hit.slice('courtside-'.length);
      ok('CS.appVersion matches the cache this phone is actually running',
         CS.appVersion === expected, CS.appVersion + ' vs ' + expected);
      CS.go('roster'); await sleep(200);
      const D = F().contentDocument;
      const txt = D.querySelector('main').textContent;
      ok('Roster shows "Courtside · offline build · <version>"',
         txt.indexOf('Courtside · offline build · ' + expected) >= 0, txt.slice(-80));
    }
  }

  grp('18. asking for a change from inside the app');
  /* The coach types a request here and it becomes a GitHub issue, which starts
     a build. Nobody relays it. These check the shape of what we would really
     send, with the network mocked - never file a real issue from a test. */
  {
    const D = F().contentDocument, W = F().contentWindow;
    const box = () => D.querySelector('main textarea.reqbox');
    const sendBtn = () => [...D.querySelectorAll('.btn.solid.wide')]
      .find(b => b.textContent === 'Send request');

    CS.S.requests = { token: '', who: '', sent: [] };
    CS.commit(); CS.go('roster'); await sleep(350);
    ok('the panel is there', /Ask for a change/.test(D.querySelector('main').textContent));
    ok('it will not send until a code is stored', !box());

    CS.S.requests = { token: 'TESTCODE', who: 'Coach', sent: [] };
    CS.commit(); CS.go('roster'); await sleep(350);
    ok('with a code, the request box appears', !!box());
    /* its own class on purpose: the roster screen already has a textarea
       (Paste names), and "the first textarea" silently meant the wrong one */
    ok('the request box is not confusable with Paste names',
       D.querySelectorAll('main textarea.inp').length > 1 &&
       D.querySelectorAll('main textarea.reqbox').length === 1);

    const realFetch = W.fetch;
    let captured = null;
    W.fetch = async (url, opts) => {
      const u = String(url);
      if (/\/issues$/.test(u) && opts && opts.method === 'POST') {
        captured = { url: u, headers: opts.headers, body: JSON.parse(opts.body) };
        return { ok: true, status: 201, json: async () => ({ number: 99, title: captured.body.title, state: 'open' }) };
      }
      if (/\/issues\/99$/.test(u)) return { ok: true, status: 200, json: async () => ({ state: 'closed' }) };
      if (/comments/.test(u)) return { ok: true, status: 200,
        json: async () => ([{ body: 'Done. Close and reopen the app twice.\n---\nfooter' }]) };
      return { ok: true, status: 200, json: async () => ([]) };
    };

    box().value = 'Show serving stats per set';
    sendBtn().click(); await sleep(800);
    ok('tapping Send really sends', !!captured, captured ? captured.body.title : 'nothing sent');
    ok('it goes to the right repository',
       captured && captured.url.indexOf('api.github.com/repos/' + CS.REPO + '/issues') >= 0,
       captured && captured.url);
    ok('it carries the stored code', captured && captured.headers.Authorization === 'Bearer TESTCODE');
    /* the label is what makes the workflow pick it up - without it nothing runs */
    ok('it is labelled coach-request', captured && captured.body.labels.indexOf('coach-request') >= 0,
       captured && captured.body.labels.join(','));
    ok('his own words are in the body', captured && /serving stats per set/i.test(captured.body.body));
    ok('the box is cleared after sending', box() && box().value === '');
    ok('it is recorded on the phone', CS.S.requests.sent.length === 1);

    await CS.refreshRequests(); await sleep(300);
    const r0 = CS.S.requests.sent[0];
    ok('the reply comes back into the app', /Done\./.test(r0.reply || ''), (r0.reply || '').slice(0, 40));
    ok('the machine-readable footer is stripped', !/footer/.test(r0.reply || ''));
    ok('it shows as done once closed', r0.state === 'closed', r0.state);
    CS.go('roster'); await sleep(300);
    ok('the reply is readable in the app', /Done\./.test(D.querySelector('main').textContent));

    /* a gym with no signal must not lose what he typed */
    CS.S.requests.sent = []; CS.commit(); CS.go('roster'); await sleep(300);
    Object.defineProperty(W.navigator, 'onLine', { configurable: true, get: () => false });
    let tries = 0;
    W.fetch = async () => { tries++; throw new Error('network'); };
    box().value = 'Add libero tracking';
    sendBtn().click(); await sleep(800);
    ok('nothing is attempted with no signal', tries === 0, tries + ' calls');
    const q = (await CS.Store.queueAll()).filter(x => x.kind === 'request');
    ok('it is kept on the phone instead', q.length === 1, q.length + ' queued');
    ok('his words survive intact', q[0] && /libero/.test(q[0].text));

    Object.defineProperty(W.navigator, 'onLine', { configurable: true, get: () => true });
    let flushed = null;
    W.fetch = async (url, opts) => {
      if (/\/issues$/.test(String(url)) && opts && opts.method === 'POST') {
        flushed = JSON.parse(opts.body);
        return { ok: true, status: 201, json: async () => ({ number: 100, title: flushed.title, state: 'open' }) };
      }
      return { ok: true, status: 200, json: async () => ([]) };
    };
    const n = await CS.flushRequestQueue();
    ok('it sends itself when signal returns', n === 1 && !!flushed, 'sent ' + n);
    ok('and it sent the right one', flushed && /libero/.test(flushed.body));
    ok('the queue is empty afterwards',
       (await CS.Store.queueAll()).filter(x => x.kind === 'request').length === 0);

    W.fetch = async () => ({ ok: false, status: 401, json: async () => ({ message: 'Bad credentials' }) });
    let msg = '';
    try { await CS.sendRequest('x'); } catch (e) { msg = e.message; }
    ok('a rejected code is explained in plain words', /access code/i.test(msg), msg);

    W.fetch = realFetch;
    CS.S.requests = { token: '', who: '', sent: [] }; CS.commit();
  }

  grp('19. cleanup — put your own data back');
  /* Restoring localStorage alone is NOT enough: the app keeps an IndexedDB
     mirror and takes whichever has the higher revision on boot, so a raw
     write loses to the test data still sitting in IDB. The restore has to go
     through commit(), which bumps the revision past it and writes both. */
  const prior = BACKUP ? JSON.parse(BACKUP) : null;
  CS = await reloadApp();
  if (prior) {
    for (const k of ['team','roster','sets','curSet','log','lineup','subLimit',
                     'opponents','matchPos','savedLineups','activeLineupId','matches','curMatch'])
      if (k in prior) CS.S[k] = prior[k];
  } else {
    CS.S.roster = CS.freshRoster(); CS.S.matches=[CS.emptyMatch()]; CS.S.curMatch=0;
    CS.S.team=''; CS.S.opponents=[]; CS.S.savedLineups=[];
    CS.S.lineup={system:'5-1',order:[null,null,null,null,null,null]};
  }
  CS.commit();
  await sleep(800);
  CS = await reloadApp();
  ok('your own data is back', prior ? CS.S.roster.length === (prior.roster||[]).length : true,
     CS.S.roster.length+' players');
  ok('no test players left behind', !CS.S.roster.some(p=>/^P\d+$/.test(p.name||'')),
     CS.S.roster.slice(0,3).map(p=>p.name).join(', '));
  ok('no test team name left behind', CS.S.team !== 'TestTeam', CS.S.team || '(blank)');

  sum.textContent = (fail===0 ? '✅ ALL ' : '❌ ') + pass + ' passed, ' + fail + ' failed';
  sum.style.color = fail===0 ? '#3DDC97' : '#EA4C60';
  window.__RESULT = {pass, fail};
})().catch(e=>{
  sum.textContent = '❌ suite crashed: ' + e.message;
  sum.style.color = '#EA4C60';
  window.__RESULT = {pass, fail, crash: e.message};
});
</script>
</body>
</html>
